
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Countdown</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#16001e;
 color:white;font-family:Arial,sans-serif;
 display:flex;align-items:center;justify-content:center;
 text-align:center;padding:15px;
 background-image:linear-gradient(#12001888,#120018bb),url("gta-background.png");
 background-size:cover;background-position:center;
}
.panel{
 width:min(900px,96vw);padding:25px;
 background:#16001ddd;border:2px solid #ff42dc;
 border-radius:22px;box-shadow:0 0 30px #ff00cc;
}
h1{font-size:clamp(30px,6vw,58px);margin:0;text-shadow:0 0 15px #ff00cc}
h2{font-size:38px;color:#ff70df;margin:5px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px auto;max-width:650px}
.time{padding:15px 5px;border:1px solid #ff55e8;border-radius:12px;background:#35002f}
.time span{display:block;font-size:clamp(25px,5vw,42px);font-weight:bold}
.time small{color:#ff9dea}
button{padding:15px 30px;border:0;border-radius:35px;background:linear-gradient(90deg,#ff22c8,#773cff);color:white;font-size:18px;font-weight:bold}
.note{font-size:12px;margin-top:20px}
@media (orientation:landscape) and (max-height:600px){
 body{padding:8px}
 .panel{width:95vw;padding:12px 25px;display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:25px}
 h1,h2,.heading{grid-column:1}
 .timer{grid-column:2;grid-row:1/4}
 button{grid-column:1}
 .note{grid-column:1/3;margin:8px}
}
</style>
</head>
<body>
<div class="panel">
 <div class="heading">
  <h1>GRAND THEFT AUTO</h1>
  <h2>VI</h2>
  <p>COMING SOON...</p>
 </div>
 <div class="timer">
  <div class="time"><span id="days">0</span><small>DAYS</small></div>
  <div class="time"><span id="hours">0</span><small>HOURS</small></div>
  <div class="time"><span id="minutes">0</span><small>MINUTES</small></div>
  <div class="time"><span id="seconds">0</span><small>SECONDS</small></div>
 </div>
 <button id="musicBtn">🎵 MUSIC ON</button>
 <div class="note">THE NEXT CHAPTER BEGINS · Unofficial fan-made countdown</div>
</div>

<script>
const target=new Date("2026-11-19T00:00:00+05:30").getTime();
function update(){
 let d=Math.max(0,target-Date.now());
 days.textContent=Math.floor(d/86400000);
 hours.textContent=Math.floor(d%86400000/3600000);
 minutes.textContent=Math.floor(d%3600000/60000);
 seconds.textContent=Math.floor(d%60000/1000);
}
update();setInterval(update,1000);

let audio=null,playing=false,loop=null;
const btn=document.getElementById("musicBtn");

function playNote(freq,start,duration){
 const osc=audio.createOscillator();
 const gain=audio.createGain();
 osc.type="triangle";
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(0.0001,start);
 gain.gain.linearRampToValueAtTime(0.16,start+0.04);
 gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
 osc.connect(gain);gain.connect(audio.destination);
 osc.start(start);osc.stop(start+duration);
}
function melody(){
 const now=audio.currentTime;
 [220,261.63,329.63,261.63,196,246.94,293.66,246.94]
 .forEach((f,i)=>playNote(f,now+i*0.35,0.32));
}
btn.addEventListener("click",async()=>{
 if(playing){
  clearInterval(loop);
  await audio.suspend();
  playing=false;btn.textContent="🎵 MUSIC ON";return;
 }
 try{
  audio=audio||new (window.AudioContext||window.webkitAudioContext)();
  await audio.resume();
  melody();
  loop=setInterval(melody,3000);
  playing=true;btn.textContent="🔇 MUSIC OFF";
 }catch(e){btn.textContent="Audio unavailable";}
});
</script>
</body>
</html>
