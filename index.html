
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    linear-gradient(rgba(10,5,30,.45), rgba(10,5,30,.85)),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1600&q=85")
    center/cover fixed;
}

.container {
  width: 92%;
  max-width: 650px;
  padding: 35px 18px;
  background: rgba(10, 5, 30, .65);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 22px;
  box-shadow: 0 0 35px #ff3cac88;
  backdrop-filter: blur(8px);
}

h1 {
  font-size: clamp(42px, 10vw, 76px);
  margin: 0;
  line-height: 1.1;
  color: #ff75c8;
  text-shadow: 0 0 15px #ff00aa;
}

h2 {
  color: #ffd1ed;
  letter-spacing: 5px;
  margin-top: 12px;
}

p { color: #eee; }

.timer {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 30px 0;
}

.time {
  background: rgba(255,255,255,.12);
  border: 1px solid #ff75c8;
  border-radius: 12px;
  padding: 15px 4px;
}

.time span {
  display: block;
  font-size: clamp(24px, 6vw, 38px);
  font-weight: bold;
  color: #fff;
}

.time small {
  color: #ffb8e5;
  font-size: 11px;
}

button {
  padding: 13px 24px;
  border: 0;
  border-radius: 30px;
  background: linear-gradient(90deg,#ff3cac,#784ba0);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.footer {
  margin-top: 25px;
  font-size: 12px;
  color: #ddd;
}
</style>
</head>

<body>
<div class="container">
  <h1>GRAND THEFT AUTO</h1>
  <h2>VI</h2>
  <p>THE COUNTDOWN IS ON</p>

  <div class="timer">
    <div class="time"><span id="days">0</span><small>DAYS</small></div>
    <div class="time"><span id="hours">0</span><small>HOURS</small></div>
    <div class="time"><span id="minutes">0</span><small>MINUTES</small></div>
    <div class="time"><span id="seconds">0</span><small>SECONDS</small></div>
  </div>

  <button id="musicButton" onclick="toggleMusic()">🎵 Music ON</button>
  <div class="footer">A FAN-MADE COUNTDOWN EXPERIENCE</div>
</div>

<script>
const releaseDate = new Date("2026-11-19T00:00:00+05:30").getTime();

function updateCountdown() {
  let distance = releaseDate - Date.now();
  if (distance < 0) distance = 0;

  document.getElementById("days").textContent =
    Math.floor(distance / 86400000);
  document.getElementById("hours").textContent =
    Math.floor((distance % 86400000) / 3600000);
  document.getElementById("minutes").textContent =
    Math.floor((distance % 3600000) / 60000);
  document.getElementById("seconds").textContent =
    Math.floor((distance % 60000) / 1000);
}

updateCountdown();
setInterval(updateCountdown, 1000);

// Original synthesized background beat
let audioContext, musicTimer, playing = false;

function toggleMusic() {
  const button = document.getElementById("musicButton");

  if (playing) {
    clearInterval(musicTimer);
    audioContext.suspend();
    playing = false;
    button.textContent = "🎵 Music ON";
    return;
  }

  audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
  audioContext.resume();

  function beat() {
    const now = audioContext.currentTime;
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(65, now);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

    osc.connect(gain);
    gain.connect(audioContext.destination);
    osc.start(now);
    osc.stop(now + 0.4);
  }

  beat();
  musicTimer = setInterval(beat, 600);
  playing = true;
  button.textContent = "🔇 Music OFF";
}
</script>
</body>
</html>
